<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edukasi Kesehatan | Klinik Pratama Gading</title>
    <link rel="icon" type="image/png" href="assets/logo-gading.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.7;
            color: #1f2937;
            background: #f8fafc;
        }

        .container {
            width: min(100% - 32px, 1120px);
            margin: 0 auto;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 700;
            color: #55bd32;
        }

        .brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .brand strong {
            color: #ef1b23;
        }

        main {
            padding: 56px 0;
        }

        .page-header {
            text-align: center;
            max-width: 760px;
            margin: 0 auto 42px;
        }

        .page-header span {
            display: inline-block;
            color: #079d91;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .page-header h1 {
            color: #111827;
            font-size: 2.2rem;
            margin-bottom: 12px;
        }

        .page-header p {
            color: #6b7280;
        }

        .filter-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
}

.filter-button {
    border: 1px solid #d1d5db;
    background: #ffffff;
    color: #374151;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

.filter-button:hover {
    border-color: #079d91;
    color: #087f78;
}

.filter-button.active {
    background: #087f78;
    border-color: #087f78;
    color: #ffffff;
}

        .article-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .article-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }

        .article-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .article-content {
            padding: 22px;
        }

        .article-category {
            display: inline-block;
            margin-bottom: 10px;
            color: #079d91;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .article-content h2 {
            font-size: 1.15rem;
            line-height: 1.4;
            margin-bottom: 10px;
            color: #111827;
        }

        .article-content p {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        .article-link {
            color: #087f78;
            font-weight: 700;
            text-decoration: none;
        }

        .article-link:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-top: 36px;
            color: #0f766e;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 50px;
            padding: 28px 0;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }

        @media (max-width: 850px) {
            .article-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 550px) {
            main {
                padding: 36px 0;
            }

            .page-header h1 {
                font-size: 1.8rem;
            }

            .article-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <a href="index.html" class="brand">
            <img src="assets/logo-gading.png" alt="Logo Klinik Pratama Gading">
            <span>Klinik Pratama <strong>Gading</strong></span>
        </a>
    </div>
</header>

<main>
    <div class="container">

        <div class="page-header">
            <span>Edukasi Kesehatan</span>
            <h1>Informasi Kesehatan untuk Anda dan Keluarga</h1>
            <p>
                Kumpulan artikel kesehatan dari Klinik Pratama Gading
                untuk membantu pasien dan keluarga memahami berbagai
                topik kesehatan dengan bahasa yang mudah dipahami.
            </p>
        </div>

        <div class="filter-bar">
    <button class="filter-button active" data-filter="all">
        Semua
    </button>

    <button class="filter-button" data-filter="umum">
        Kesehatan Umum
    </button>

    <button class="filter-button" data-filter="gigi">
        Kesehatan Gigi
    </button>

    <button class="filter-button" data-filter="kehamilan">
        Kehamilan
    </button>

    <button class="filter-button" data-filter="interna">
    Penyakit Dalam
</button>
</div>

        <div class="article-grid" id="all-articles"></div>

        <a href="index.html#edukasi" class="back-link">
            ← Kembali ke Beranda
        </a>

    </div>
</main>

<footer>
    <div class="container">
        Klinik Pratama Gading
    </div>
</footer>


<script src="articles.js"></script>
<script>
    const allArticlesContainer = document.getElementById('all-articles');

    const sortedArticles = [...articles]
        .sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));

    function renderArticles(selectedCategory = 'all') {
        const filteredArticles = selectedCategory === 'all'
            ? sortedArticles
            : sortedArticles.filter(
                (article) => article.categoryKey === selectedCategory
            );

        allArticlesContainer.innerHTML = filteredArticles
            .map((article) => `
                <article class="article-card" data-category="${article.categoryKey}">
                    <img
                        src="${article.image}"
                        alt="${article.title}"
                    >

                    <div class="article-content">
                        <span class="article-category">
                            ${article.category}
                        </span>

                        <h2>${article.title}</h2>

                        <p>${article.summary}</p>

                        <a href="${article.url}" class="article-link">
                            Baca artikel →
                        </a>
                    </div>
                </article>
            `)
            .join('');
    }

    renderArticles();

    const filterButtons = document.querySelectorAll('.filter-button');

    filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
            filterButtons.forEach((item) => {
                item.classList.remove('active');
            });

            button.classList.add('active');
            renderArticles(button.dataset.filter);
        });
    });
</script>
</body>
</html>
